; ---------------------------------------------------------------------------
; firmware_remote — M5StickC Plus + Hat MiniJoyC の ESP-NOW リモコン
;
; board = m5stick-c だが M5Unified が実行時に StickC / StickC Plus を判別するため
; StickC Plus でもそのまま動作する。WiFi 資格情報は持たず ESP-NOW のみを使う。
; ---------------------------------------------------------------------------
[platformio]
default_envs = m5stick-c-plus

[env:m5stick-c-plus]
platform = espressif32@6.9.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -I../shared
lib_deps =
    ; firmware/ (CoreS3 側) と同じ版に固定する
    m5stack/M5Unified@0.2.17
    https://github.com/m5stack/M5Hat-Mini-JoyC.git
