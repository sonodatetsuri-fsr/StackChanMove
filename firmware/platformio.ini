[platformio]
default_envs = m5stack-cores3

[env:m5stack-cores3]
platform = espressif32@6.9.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_build.partitions = default_16MB.csv
build_unflags =
    -std=gnu++11
build_flags =
    -DARDUINO_M5STACK_CORES3
    -DBOARD_HAS_PSRAM
    -std=gnu++17
    -DUART_SCLK_DEFAULT=UART_SCLK_APB
    ; リモコンと共有するプロトコル / 写像ヘッダ (../shared)
    -I../shared
lib_deps =
    ; M5Unified 0.2.21 で IOExpander_Base の API が変わり StackChan-BSP がビルドできないため固定
    m5stack/M5Unified@0.2.17
    m5stack/M5GFX@^0.2.4
    https://github.com/m5stack/StackChan-BSP.git
    crankyoldgit/IRremoteESP8266
    m5stack/M5Unit-NFC
    meganetaaan/M5Stack-Avatar@^0.10.0
    bblanchon/ArduinoJson@^7.4.1

[env:native]
platform = native
build_flags = -std=gnu++17 -Isrc -I../shared
test_framework = unity
lib_deps =
    ; テストベクタ (tests/fixtures/pos_tracker_vectors.json) の読み込み
    bblanchon/ArduinoJson@^7.4.1
